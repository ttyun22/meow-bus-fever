<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>巴士大疏通</title>
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <div id="app">

    <!-- ===== 开始页 ===== -->
    <section id="screen-start" class="screen">
      <div class="start-card">
        <div class="start-buses">
          <div class="mini-bus c-red"></div>
          <div class="mini-bus c-blue"></div>
          <div class="mini-bus c-green"></div>
        </div>
        <h1 class="game-title">巴士大疏通</h1>
        <p class="game-sub">停车场堵成一锅粥，你来疏通！</p>
        <ul class="start-rules">
          <li><span class="rule-ico">🚌</span><span>点击巴士，沿<b>车头方向</b>驶出停车场，前方被挡可不行</span></li>
          <li><span class="rule-ico">🎨</span><span>乘客只上<b>同色巴士</b>，队伍<b>最前面</b>的乘客先上车</span></li>
          <li><span class="rule-ico">🅿️</span><span>接客位<b>有限</b>：坐满发车腾空位，占满了就会堵死</span></li>
        </ul>
        <div class="start-actions">
          <button id="btn-start" class="btn btn-primary btn-big">开始游戏</button>
          <button id="btn-levels" class="btn btn-ghost btn-big" title="选择任意关卡直接游玩">选择关卡</button>
        </div>
        <p class="start-foot" id="start-foot">纯原创玩法演示</p>
      </div>
    </section>

    <!-- ===== 游戏页 ===== -->
    <section id="screen-game" class="screen hidden">
      <header id="hud">
        <div class="hud-left"><button id="hud-level" class="hud-level-btn" title="选择关卡">第 1 关</button></div>
        <div class="hud-mid"><span id="hud-moves">操作 0</span></div>
        <div class="hud-right">
          <button id="btn-undo" class="btn btn-ghost" disabled title="撤销最近一次操作及其自动结算">撤回（2）</button>
          <button id="btn-hint" class="btn btn-ghost" title="查看本关提示">提示</button>
          <button id="btn-restart" class="btn btn-ghost" title="重新开始本关">重开</button>
          <button id="btn-mute" class="btn btn-ghost btn-icon" title="音效开关">🔊</button>
        </div>
      </header>

      <section id="queue-area">
        <div class="area-label">🧍 候车队列 <span class="area-sub">（最左边先上车）</span></div>
        <div id="queue"></div>
      </section>

      <section id="slots-area">
        <div class="area-label">🅿️ 接客位</div>
        <div id="slots"></div>
      </section>

      <section id="board-area">
        <div class="area-label">🚌 停车场 <span class="area-sub">（点击巴士驶出）</span></div>
        <div id="board-wrap"><div id="board"></div></div>
      </section>
    </section>

    <!-- ===== 选关页 ===== -->
    <section id="screen-levels" class="screen hidden">
      <header id="levels-head">
        <button id="btn-levels-back" class="btn btn-ghost" title="返回">← 返回</button>
        <div class="levels-title">
          <h2>选择关卡</h2>
          <span id="levels-count" class="levels-count"></span>
        </div>
      </header>
      <div id="level-grid" class="level-grid"></div>
    </section>

    <!-- 全局提示条 -->
    <div id="toast" class="toast hidden"></div>

    <!-- 分阶段教学气泡（非模态：不遮挡、不阻塞其他合法操作） -->
    <div id="tut-bubble" class="tut-bubble hidden">
      <p id="tut-text"></p>
      <button id="tut-ok" class="btn btn-primary hidden">知道了</button>
    </div>

    <!-- ===== 结算覆盖层 ===== -->
    <div id="overlay" class="overlay hidden">
      <div class="overlay-card">
        <div id="overlay-icon" class="overlay-icon">🎉</div>
        <h2 id="overlay-title">通关！</h2>
        <p id="overlay-text"></p>
        <div class="overlay-btns">
          <button id="btn-overlay-secondary" class="btn btn-ghost hidden">重试</button>
          <button id="btn-overlay-primary" class="btn btn-primary">下一关</button>
        </div>
      </div>
    </div>

  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
